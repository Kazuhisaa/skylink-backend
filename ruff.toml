target-version = "py312"
line-length = 100
exclude = [
    "migrations/",
    ".git",
    "__pycache__",
    "venv",
]

[lint]
select = [
    "E",
    "W",
    "F",
    "I",
]
ignore = [
    "E501",
    "B008",
    "E402",
]

[lint.per-file-ignores]
"app/models/__init__.py" = ["F401"]     # F401 = imported but unused ignore in __init__.py

[lint.isort]
known-first-party = ["app"]

[format]
quote-style = "double"
indent-style = "space"